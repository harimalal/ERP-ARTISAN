<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plan 15 000€ — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --a:#5B4FD9;--a-l:#EEE9FF;--a-m:#B8AFFE;
  --r:#0B7B5B;--r-l:#E0F5ED;--r-m:#74D4B0;
  --c:#C4521F;--c-l:#FFF0E8;--c-m:#F7B98A;
  --ink:#0F0F0E;--ink2:#3A3A36;--muted:#8A8880;
  --bg:#F7F5F0;--card:#FFFFFF;--border:#E2DFD6;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink)}

/* ══════════════════════════════════════
   APP SHELL
══════════════════════════════════════ */
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* SCREENS */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);will-change:transform;overflow:hidden}
.screen.active{transform:translateX(0)}
.screen.prev{transform:translateX(-30%)}

/* TOP NAV */
.topbar{flex-shrink:0;padding:calc(var(--safe-top) + 14px) 20px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:10}
.topbar-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em}
.btn-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);padding:6px 0;cursor:pointer;background:none;border:none}
.btn-back svg{width:18px;height:18px}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 80px)}
.scroll::-webkit-scrollbar{display:none}

/* ══════════════════════════════════════
   SCREEN 0 — HOME / DASHBOARD
══════════════════════════════════════ */
.home-hero{padding:20px 20px 0;background:var(--bg)}
.hero-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hero-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;line-height:1.1;margin-bottom:4px}
.hero-sub{font-size:13px;color:var(--muted)}

/* GLOBAL PROGRESS */
.global-ring{padding:20px;display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:6}
.ring-fill{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-family:'Syne',sans-serif;font-size:15px;font-weight:800}
.ring-days{font-size:9px;color:var(--muted);font-weight:500;margin-top:-2px}
.ring-info{flex:1}
.ring-info-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;margin-bottom:2px}
.ring-info-sub{font-size:12px;color:var(--muted);line-height:1.5}

/* TODAY CARD */
.today-card{margin:0 16px 16px;border-radius:16px;padding:16px;cursor:pointer;position:relative;overflow:hidden;active:opacity:0.85}
.today-card::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.08);opacity:0;transition:opacity .15s}
.today-card:active::before{opacity:1}
.today-chip{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
.today-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;line-height:1.3;margin-bottom:8px}
.today-meta{font-size:12px;opacity:.8;margin-bottom:12px;line-height:1.4}
.today-cta{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.25);padding:7px 12px;border-radius:20px}

/* PROJECT CARDS */
.section-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 20px 10px}
.proj-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 16px 16px}
.proj-card{border-radius:14px;padding:14px 12px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.proj-card:active{transform:scale(.97)}
.proj-name{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;margin-bottom:8px;line-height:1.2}
.proj-rev{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;margin-bottom:4px}
.proj-pct{font-size:10px;opacity:.7;margin-bottom:8px}
.proj-bar{height:3px;background:rgba(0,0,0,.1);border-radius:2px;overflow:hidden}
.proj-bar-fill{height:100%;background:rgba(0,0,0,.35);border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* PHASE MINI MAP */
.phase-map{padding:0 16px 16px}
.phase-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-radius:12px;margin-bottom:6px;cursor:pointer;border:1px solid var(--border);transition:all .15s}
.phase-row:active{transform:scale(.98)}
.phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.phase-dot-a{background:var(--a)}
.phase-dot-r{background:var(--r)}
.phase-dot-c{background:var(--c)}
.phase-dot-done{background:#22c55e}
.phase-dot-active{background:var(--ink)}
.phase-dot-pending{background:var(--border)}
.phase-info{flex:1}
.phase-name{font-size:13px;font-weight:500}
.phase-dates{font-size:11px;color:var(--muted);margin-top:1px}
.phase-badge{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

/* RITUEL CARD */
.rituel-card{margin:0 16px 16px;background:var(--ink);border-radius:16px;padding:18px;color:white}
.rituel-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rituel-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rituel-item:last-child{border-bottom:none}
.rituel-num{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);min-width:18px;padding-top:2px}
.rituel-text{font-size:12px;line-height:1.5;color:rgba(255,255,255,.85)}
.rituel-text strong{color:white}

/* ══════════════════════════════════════
   SCREEN 1 — CALENDRIER
══════════════════════════════════════ */
.cal-phases{padding:0 16px 16px}
.cal-phase-block{margin-bottom:20px}
.cal-phase-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px 10px;display:flex;align-items:center;gap:8px}
.cal-phase-title::after{content:'';flex:1;height:1px;background:var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s;border:1.5px solid transparent}
.cal-day:active{transform:scale(.92)}
.cal-day-num{font-size:11px;font-weight:600;line-height:1}
.cal-day-dot{width:4px;height:4px;border-radius:50%;margin-top:2px}
.cal-day.done{opacity:.6}
.cal-day.done .cal-day-num{text-decoration:line-through}
.cal-day.today{border-color:var(--ink)!important}
.cal-day.pending{background:var(--bg)}
.cal-day-a{background:var(--a-l);color:var(--a)}
.cal-day-a .cal-day-dot{background:var(--a)}
.cal-day-r{background:var(--r-l);color:var(--r)}
.cal-day-r .cal-day-dot{background:var(--r)}
.cal-day-c{background:var(--c-l);color:var(--c)}
.cal-day-c .cal-day-dot{background:var(--c)}
.cal-day-b{background:#F1EFE8;color:var(--ink2)}
.cal-day-b .cal-day-dot{background:var(--ink2)}
.cal-legend{display:flex;gap:12px;padding:0 4px 12px;flex-wrap:wrap}
.cal-leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.cal-leg-dot{width:8px;height:8px;border-radius:50%}

/* ══════════════════════════════════════
   SCREEN 2 — DAY DETAIL
══════════════════════════════════════ */
.day-topbar{flex-shrink:0;padding:calc(var(--safe-top) + 10px) 16px 0;background:var(--bg)}
.day-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav-arrow{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0}
.nav-arrow:active{transform:scale(.92)}
.nav-arrow svg{width:16px;height:16px}
.nav-center{text-align:center;flex:1}
.nav-daynum{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em}
.nav-date{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}

.day-header-card{margin:0 16px 0;border-radius:16px;padding:16px 18px;margin-bottom:1px}
.day-h-project{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;opacity:.75}
.day-h-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;line-height:1.2;margin-bottom:10px}
.day-h-phase{font-size:11px;opacity:.7}

/* PROGRESS DOTS */
.day-progress{display:flex;gap:3px;flex-wrap:wrap;padding:12px 16px 4px}
.dprog-dot{width:6px;height:6px;border-radius:50%;background:var(--border);transition:background .3s}
.dprog-dot.done-a{background:var(--a)}
.dprog-dot.done-r{background:var(--r)}
.dprog-dot.done-c{background:var(--c)}
.dprog-dot.done-b{background:var(--ink2)}
.dprog-dot.current{background:var(--ink);box-shadow:0 0 0 2px rgba(15,15,14,.2)}

/* SECTIONS */
.day-section{padding:12px 16px 0}
.sec-label{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

.avant-box{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border);border-left-width:3px}
.avant-box.col-a{border-left-color:var(--a)}
.avant-box.col-r{border-left-color:var(--r)}
.avant-box.col-c{border-left-color:var(--c)}
.avant-box.col-b{border-left-color:var(--ink2)}
.avant-title{font-size:11px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.avant-text{font-size:13px;line-height:1.6;color:var(--ink2)}

/* 5W */
.fivew{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 16px 0}
.w-cell{background:var(--card);border-radius:10px;padding:10px 12px;border:1px solid var(--border)}
.w-cell.span2{grid-column:span 2}
.w-lbl{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.w-val{font-size:12px;font-weight:500;line-height:1.4}

/* SESSION */
.session-box{margin:12px 16px 0;background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border)}
.session-text{font-size:13px;line-height:1.65;color:var(--ink2)}

/* STEPS */
.steps-list{padding:0 16px;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.step-row{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:10px;padding:12px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.step-row.checked{background:#F0FDF4;border-color:#86EFAC}
.step-row.checked .step-text{text-decoration:line-through;color:var(--muted)}
.step-cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:0px}
.step-row.checked .step-cb{background:#22c55e;border-color:#22c55e}
.step-num{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);min-width:18px;padding-top:2px;flex-shrink:0}
.step-text{font-size:13px;line-height:1.5;flex:1}

/* LIVRABLE */
.livrable-box{margin:12px 16px 0;border-radius:12px;padding:14px;border:2px solid}
.livrable-box.col-a{background:var(--a-l);border-color:var(--a-m)}
.livrable-box.col-r{background:var(--r-l);border-color:var(--r-m)}
.livrable-box.col-c{background:var(--c-l);border-color:var(--c-m)}
.livrable-box.col-b{background:#F1EFE8;border-color:var(--border)}
.livrable-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.livrable-lbl.col-a{color:var(--a)}
.livrable-lbl.col-r{color:var(--r)}
.livrable-lbl.col-c{color:var(--c)}
.livrable-lbl.col-b{color:var(--ink2)}
.livrable-text{font-size:13px;font-weight:500;line-height:1.5}

/* APRES */
.apres-box{margin:12px 16px 0;background:var(--ink);border-radius:12px;padding:14px;color:white}
.apres-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.5;margin-bottom:6px}
.apres-text{font-size:13px;line-height:1.6;opacity:.85}

/* DONE BUTTON */
.done-btn{margin:16px 16px 0;width:calc(100% - 32px);padding:16px;border-radius:14px;border:none;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.done-btn.col-a{background:var(--a);color:white}
.done-btn.col-r{background:var(--r);color:white}
.done-btn.col-c{background:var(--c);color:white}
.done-btn.col-b{background:var(--ink);color:white}
.done-btn.completed{background:#22c55e!important;color:white}
.done-btn:active{transform:scale(.97)}

/* ══════════════════════════════════════
   BOTTOM TAB BAR
══════════════════════════════════════ */
.tabbar{flex-shrink:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding:8px 0 calc(var(--safe-bottom) + 8px)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 0;transition:all .15s}
.tab-item:active{transform:scale(.9)}
.tab-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.tab-icon svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.tab-label{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:.03em;transition:color .15s}
.tab-item.active .tab-icon svg{stroke:var(--ink)}
.tab-item.active .tab-label{color:var(--ink);font-weight:700}

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .35s ease forwards}
.fade-up-1{animation-delay:.05s;opacity:0}
.fade-up-2{animation-delay:.1s;opacity:0}
.fade-up-3{animation-delay:.15s;opacity:0}
.fade-up-4{animation-delay:.2s;opacity:0}
.fade-up-5{animation-delay:.25s;opacity:0}
</style>
</head>
<body>
<div id="app">
  <!-- SCREENS -->
  <div class="screen active" id="screen-home">
    <div class="scroll" id="scroll-home"></div>
  </div>
  <div class="screen" id="screen-cal">
    <div class="topbar">
      <button class="btn-back" onclick="goHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
        Accueil
      </button>
      <span class="topbar-title">Calendrier</span>
      <span style="width:60px"></span>
    </div>
    <div class="scroll" id="scroll-cal"></div>
  </div>
  <div class="screen" id="screen-day">
    <div class="day-topbar" id="day-topbar"></div>
    <div class="scroll" id="scroll-day"></div>
  </div>

  <!-- TAB BAR -->
  <div class="tabbar" id="tabbar">
    <div class="tab-item active" onclick="showTab('home')" id="tab-home">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
      <span class="tab-label">Accueil</span>
    </div>
    <div class="tab-item" onclick="showTab('cal')" id="tab-cal">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <span class="tab-label">Calendrier</span>
    </div>
    <div class="tab-item" onclick="goToToday()" id="tab-today">
      <div class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <span class="tab-label">Aujourd'hui</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

steps:["Calculer les revenus totaux : ARTEASY + REFLEX + COSMETIC","Comparer à l'objectif 15 000€","Documenter les 3 actions qui ont généré 80% des résultats","Documenter les 3 erreurs à ne pas répéter","Rédiger le plan octobre"],
livrable:"Bilan total chiffré. Rapport de performance. Plan octobre rédigé.",
apres:"Célèbre ce que tu as accompli. 84 jours de travail constant mérite une vraie reconnaissance.",
target:"🎯 OBJECTIF FINAL : 15 000€"}
];

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
const STATE_KEY='plan15k_state';
let state={checked:{},daysDone:[],currentDay:0};
function loadState(){try{const s=localStorage.getItem(STATE_KEY);if(s)state=JSON.parse(s)}catch(e){}}
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(e){}}
loadState();

// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════
const PROJ_COLORS={
  a:{bg:'#EEE9FF',text:'#5B4FD9',name:'ARTEASY',card:'linear-gradient(135deg,#5B4FD9,#7B70F0)',dot:'done-a'},
  r:{bg:'#E0F5ED',text:'#0B7B5B',name:'REFLEX IA',card:'linear-gradient(135deg,#0B7B5B,#1DAF80)',dot:'done-r'},
  c:{bg:'#FFF0E8',text:'#C4521F',name:'COSMETIC',card:'linear-gradient(135deg,#C4521F,#E8732F)',dot:'done-c'},
  b:{bg:'#F1EFE8',text:'#3A3A36',name:'BILAN',card:'linear-gradient(135deg,#3A3A36,#6B6A65)',dot:'done-b'}
};
function col(p){return `col-${p}`}
function isDone(di){return state.daysDone.includes(di)}
function stepsKey(di){return `steps_${di}`}
function getStepsDone(di){return state.checked[stepsKey(di)]||[]}

function totalSteps(){return DAYS.reduce((a,d)=>a+d.steps.length,0)}
function stepsCompleted(){return Object.values(state.checked).reduce((a,arr)=>a+(arr||[]).filter(Boolean).length,0)}
function overallPct(){return Math.round(stepsCompleted()/totalSteps()*100)}

function projStats(pr){
  const days=DAYS.filter((d,i)=>d.pr===pr);
  const total=days.reduce((a,d)=>a+d.steps.length,0);
  const done=days.reduce((a,d,_,__,di=DAYS.indexOf(d))=>{
    return a+(getStepsDone(DAYS.indexOf(d)).filter(Boolean).length);
  },0);
  return {total,done,pct:total?Math.round(done/total*100):0};
}

// today = first non-done day
function getTodayIdx(){
  for(let i=0;i<DAYS.length;i++){if(!isDone(i))return i}
  return DAYS.length-1;
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
let currentScreen='home';
let activeTabBar='home';

function showTab(name){
  // update tabbar
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  activeTabBar=name;
  if(name==='home'){showScreen('home');renderHome()}
  else if(name==='cal'){showScreen('cal');renderCal()}
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.remove('active','prev');
  });
  const s=document.getElementById('screen-'+id);
  s.classList.add('active');
  // If going to day, hide tabbar
  document.getElementById('tabbar').style.display=id==='day'?'none':'flex';
  currentScreen=id;
}

function goHome(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active','prev'));
  document.getElementById('screen-home').classList.add('active');
  document.getElementById('tabbar').style.display='flex';
  showTab('home');
}

function openDay(idx){
  state.currentDay=idx;
  saveState();
  renderDayDetail(idx);
  showScreen('day');
}

function goToToday(){
  openDay(getTodayIdx());
}

// ══════════════════════════════════════
// RENDER HOME
// ══════════════════════════════════════
function renderHome(){
  const pct=overallPct();
  const todayIdx=getTodayIdx();
  const today=DAYS[todayIdx];
  const tc=PROJ_COLORS[today.pr];
  const circumference=2*Math.PI*34;
  const offset=circumference-(pct/100)*circumference;
  const doneCount=state.daysDone.length;

  const aS=projStats('a'),rS=projStats('r'),cS=projStats('c');
  // revenue projections
  const aSales=Math.round(aS.pct/100*35);
  const aRev=(aSales*350).toLocaleString('fr');
  const rRev=Math.round(rS.pct/100*2000).toLocaleString('fr');
  const cRev=Math.round(cS.pct/100*1000).toLocaleString('fr');

  const html=`
<div class="home-hero fade-up">
  <div class="hero-label">Juin → Août 2026</div>
  <div class="hero-title">Plan 15 000€</div>
  <div class="hero-sub">84 jours · 3 projets · 2h/jour</div>
</div>
<div class="global-ring fade-up fade-up-1">
  <div class="ring-wrap">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle class="ring-bg" cx="40" cy="40" r="34"/>
      <circle class="ring-fill" cx="40" cy="40" r="34"
        stroke-dasharray="${circumference}"
        stroke-dashoffset="${offset}"/>
    </svg>
    <div class="ring-label">
      <span class="ring-pct">${pct}%</span>
      <span class="ring-days">${doneCount}/84j</span>
    </div>
  </div>
  <div class="ring-info">
    <div class="ring-info-title">Progression globale</div>
    <div class="ring-info-sub">${stepsCompleted()} étapes sur ${totalSteps()} complétées<br>${84-doneCount} jours restants</div>
  </div>
</div>
<div class="today-card fade-up fade-up-2" style="background:${tc.card}" onclick="openDay(${todayIdx})">
  <div class="today-chip">▶ AUJOURD'HUI · JOUR ${todayIdx+1}</div>
  <div class="today-title">${today.title}</div>
  <div class="today-meta">${today.date} · ${tc.name}</div>
  <div class="today-cta">Commencer la session →</div>
</div>
<div class="section-title fade-up fade-up-3">Par projet</div>
<div class="proj-cards fade-up fade-up-3">
  <div class="proj-card" style="background:#EEE9FF" onclick="openDaysByProj('a')">
    <div class="proj-name" style="color:#5B4FD9">ARTEASY</div>
    <div class="proj-rev" style="color:#5B4FD9">${aRev}€</div>
    <div class="proj-pct" style="color:#5B4FD9">${aS.pct}% fait</div>
    <div class="proj-bar"><div class="proj-bar-fill" style="width:${aS.pct}%;background:#5B4FD9"></div></div>
  </div>
  <div class="proj-card" style="background:#E0F5ED" onclick="openDaysByProj('r')">
    <div class="proj-name" style="color:#0B7B5B">REFLEX IA</div>
    <div class="proj-rev" style="color:#0B7B5B">${rRev}€</div>
    <div class="proj-pct" style="color:#0B7B5B">${rS.pct}% fait</div>
    <div class="proj-bar"><div class="proj-bar-fill" style="width:${rS.pct}%;background:#0B7B5B"></div></div>
  </div>
  <div class="proj-card" style="background:#FFF0E8" onclick="openDaysByProj('c')">
    <div class="proj-name" style="color:#C4521F">COSMETIC</div>
    <div class="proj-rev" style="color:#C4521F">${cRev}€</div>
    <div class="proj-pct" style="color:#C4521F">${cS.pct}% fait</div>
    <div class="proj-bar"><div class="proj-bar-fill" style="width:${cS.pct}%;background:#C4521F"></div></div>
  </div>
</div>
<div class="section-title fade-up fade-up-4">Phases</div>
<div class="phase-map fade-up fade-up-4">
  ${[
    {name:'Phase 1 · S1–S2',dates:'1–14 juin',days:14,start:0},
    {name:'Phase 2 · S3–S5',dates:'15 juin – 3 juil',days:21,start:14},
    {name:'Phase 3 · S6–S8',dates:'4–14 juil',days:14,start:35},
    {name:'Phase 4 · S9–S12',dates:'15 juil – 1er août',days:14,start:49}
  ].map(ph=>{
    const done=state.daysDone.filter(i=>i>=ph.start&&i<ph.start+ph.days).length;
    const active=todayIdx>=ph.start&&todayIdx<ph.start+ph.days;
    const allDone=done===ph.days;
    const dotClass=allDone?'phase-dot-done':active?'phase-dot-active':'phase-dot-pending';
    return`<div class="phase-row" onclick="showTab('cal')">
      <div class="phase-dot ${dotClass}"></div>
      <div class="phase-info">
        <div class="phase-name">${ph.name}</div>
        <div class="phase-dates">${ph.dates}</div>
      </div>
      <div class="phase-badge">${done}/${ph.days}j</div>
    </div>`;
  }).join('')}
</div>
<div class="section-title fade-up fade-up-5">🧠 Rituel de tenue sur la durée</div>
<div class="rituel-card fade-up fade-up-5">
  <div class="rituel-title">⚡ Le protocole des 84 jours</div>
  ${[
    ['01','<strong>Avant chaque session</strong> : ferme tout sauf l\'outil du jour. Timer 2h. Aucune exception.'],
    ['02','<strong>1 seul livrable par jour.</strong> Pas 2. Pas 3. Le livrable doit exister physiquement à la fin.'],
    ['03','<strong>Dimanche = bilan.</strong> 3 questions. Pas dans la tête — écrit. Toujours.'],
    ['04','<strong>Si tu rates un jour</strong> : pas de rattrapage. Tu passes au lendemain. Pas de culpabilité, pas de double charge.'],
    ['05','<strong>Le 80/20 absolu</strong> : ARTEASY = 60% de ton énergie. Tout le reste est secondaire.'],
    ['06','<strong>Prospection ARTEASY</strong> = la tâche non-négociable. Avant tout le reste, chaque jour.'],
    ['07','<strong>Mesure tout.</strong> Contactés / Réponses / Démos / Ventes. Chaque semaine. Sans données = navigation aveugle.'],
    ['08','<strong>Le revenu vient des autres.</strong> Chaque jour sans action vers un prospect = journée perdue.']
  ].map(([n,t])=>`<div class="rituel-item"><span class="rituel-num">${n}</span><span class="rituel-text">${t}</span></div>`).join('')}
</div>
<div style="height:8px"></div>`;
  document.getElementById('scroll-home').innerHTML=html;
}

// ══════════════════════════════════════
// RENDER CALENDAR
// ══════════════════════════════════════
function renderCal(){
  const todayIdx=getTodayIdx();
  const phases=[
    {name:'Phase 1 · Fondations',days:DAYS.slice(0,14).map((_,i)=>i)},
    {name:'Phase 2 · Prospection & traction',days:DAYS.slice(14,35).map((_,i)=>i+14)},
    {name:'Phase 3 · Scale & revenus',days:DAYS.slice(35,49).map((_,i)=>i+35)},
    {name:'Phase 4 · Sprint final',days:DAYS.slice(49).map((_,i)=>i+49)}
  ];
  let html=`
<div style="padding:12px 20px 8px">
  <div class="cal-legend">
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#5B4FD9"></div>ARTEASY</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#0B7B5B"></div>REFLEX IA</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#C4521F"></div>COSMETIC</div>
    <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#3A3A36"></div>Bilan</div>
  </div>
</div>
<div class="cal-phases">`;
  phases.forEach(ph=>{
    html+=`<div class="cal-phase-block"><div class="cal-phase-title">${ph.name}</div><div class="cal-grid">`;
    ph.days.forEach(di=>{
      const d=DAYS[di];
      const c=`cal-day-${d.pr}`;
      const done=isDone(di)?'done':'';
      const today=di===todayIdx?'today':'';
      // day number in month
      const dnum=di+1;
      html+=`<div class="cal-day ${c} ${done} ${today}" onclick="openDay(${di})">
        <span class="cal-day-num">${dnum}</span>
        <div class="cal-day-dot"></div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  document.getElementById('scroll-cal').innerHTML=html;
}

// ══════════════════════════════════════
// RENDER DAY DETAIL
// ══════════════════════════════════════
function renderDayDetail(idx){
  const d=DAYS[idx];
  const c=PROJ_COLORS[d.pr];
  const colClass=`col-${d.pr}`;
  const done=isDone(idx);
  const stepsDone=getStepsDone(idx);
  const allStepsDone=d.steps.every((_,i)=>stepsDone[i]);

  // TOP NAV
  const topHtml=`
<div class="day-nav">
  <button class="nav-arrow" onclick="goBackFromDay()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
  </button>
  <div class="nav-center">
    <div class="nav-daynum">JOUR ${idx+1} / ${DAYS.length}</div>
    <div class="nav-date">${d.date}</div>
  </div>
  <button class="nav-arrow" onclick="openDay(${Math.min(idx+1,DAYS.length-1)})" ${idx===DAYS.length-1?'style="opacity:.3;pointer-events:none"':''}>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M14 5l7 7-7 7"/></svg>
  </button>
</div>`;
  document.getElementById('day-topbar').innerHTML=topHtml;

  // PROGRESS DOTS (all 84)
  const dotsHtml=`<div class="day-progress">${DAYS.map((_,i)=>{
    let cls='dprog-dot';
    if(i===idx)cls+=' current';
    else if(isDone(i))cls+=` ${PROJ_COLORS[DAYS[i].pr].dot}`;
    return`<div class="${cls}"></div>`;
  }).join('')}</div>`;

  // HEADER CARD
  const headerHtml=`
<div class="day-header-card ${colClass}" style="background:${c.card}">
  <div class="day-h-project" style="color:rgba(255,255,255,.8)">${c.name}</div>
  <div class="day-h-title" style="color:white">${d.title}</div>
  <div class="day-h-phase" style="color:rgba(255,255,255,.7)">${d.ph}</div>
</div>`;

  // STEPS
  const stepsHtml=`
<div class="day-section"><div class="sec-label">Étapes pas à pas</div></div>
<div class="steps-list">${d.steps.map((s,i)=>{
    const checked=stepsDone[i]?'checked':'';
    return`<div class="step-row ${checked}" id="step-${idx}-${i}" onclick="toggleStep(${idx},${i})">
      <span class="step-num">${String(i+1).padStart(2,'0')}</span>
      <span class="step-text">${s}</span>
      <div class="step-cb">${checked?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</div>
    </div>`;
  }).join('')}</div>`;

  const bodyHtml=`
${dotsHtml}
${headerHtml}
<div class="day-section">
  <div class="sec-label">Avant la session — 10 min</div>
  <div class="avant-box ${colClass}">
    <div class="avant-title" style="color:${c.text}">▶ Préparer</div>
    <div class="avant-text">${d.avant}</div>
  </div>
</div>
<div class="fivew">
  <div class="w-cell"><div class="w-lbl">Qui</div><div class="w-val">${d.w.qui}</div></div>
  <div class="w-cell"><div class="w-lbl">À qui</div><div class="w-val">${d.w.aqui}</div></div>
  <div class="w-cell"><div class="w-lbl">Quand</div><div class="w-val">${d.w.quand}</div></div>
  <div class="w-cell"><div class="w-lbl">Comment</div><div class="w-val">${d.w.comment}</div></div>
  <div class="w-cell span2"><div class="w-lbl">Quoi</div><div class="w-val">${d.w.quoi}</div></div>
</div>
<div class="day-section">
  <div class="sec-label">Session 2h</div>
  <div class="session-box"><div class="session-text">${d.session}</div></div>
</div>
${stepsHtml}
<div class="day-section">
  <div class="sec-label">Livrable du jour</div>
</div>
<div class="livrable-box ${colClass}" style="margin:0 16px">
  <div class="livrable-lbl ${colClass}">◆ À produire aujourd'hui</div>
  <div class="livrable-text">${d.livrable}</div>
</div>
<div class="day-section">
  <div class="sec-label">Après la session — 5 min</div>
</div>
<div class="apres-box">
  <div class="apres-title">↩ Clôturer</div>
  <div class="apres-text">${d.apres}</div>
</div>
<button class="done-btn ${colClass} ${done||allStepsDone?'completed':''}" id="done-btn-${idx}" onclick="markDone(${idx})">
  ${done?'✓ Journée validée !':`${allStepsDone?'✓ Marquer comme terminée':'Marquer comme terminée'}`}
</button>
<div style="height:8px"></div>`;

  document.getElementById('scroll-day').innerHTML=bodyHtml;
  document.getElementById('scroll-day').scrollTop=0;
}

function goBackFromDay(){
  showScreen(activeTabBar==='cal'?'cal':'home');
  document.getElementById('tabbar').style.display='flex';
  if(activeTabBar==='cal')renderCal();
  else renderHome();
}

function toggleStep(di,si){
  const key=stepsKey(di);
  if(!state.checked[key])state.checked[key]=[];
  state.checked[key][si]=!state.checked[key][si];
  saveState();
  // re-render step
  const row=document.getElementById(`step-${di}-${si}`);
  const d=DAYS[di];
  const checked=state.checked[key][si];
  row.className=`step-row ${checked?'checked':''}`;
  row.querySelector('.step-cb').innerHTML=checked?'<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
  row.querySelector('.step-text').style.textDecoration=checked?'line-through':'none';
  // check if all done
  const allDone=d.steps.every((_,i)=>state.checked[key][i]);
  const btn=document.getElementById(`done-btn-${di}`);
  if(allDone){btn.classList.add('completed');btn.textContent='✓ Toutes les étapes faites !';}
  if(checked)showToast('Étape cochée ✓');
}

function markDone(idx){
  if(!state.daysDone.includes(idx)){
    state.daysDone.push(idx);
    // also mark all steps
    const key=stepsKey(idx);
    if(!state.checked[key])state.checked[key]=[];
    DAYS[idx].steps.forEach((_,i)=>state.checked[key][i]=true);
    saveState();
    const btn=document.getElementById(`done-btn-${idx}`);
    btn.classList.add('completed');
    btn.textContent='✓ Journée validée !';
    showToast('🎯 Journée validée ! +1 vers 15 000€');
    setTimeout(()=>{
      const next=idx+1;
      if(next<DAYS.length){
        showToast(`→ Demain : ${DAYS[next].title.substring(0,30)}...`);
      }
    },2500);
  }
}

function openDaysByProj(pr){
  showTab('cal');
  // scroll to first day of project
  setTimeout(()=>{
    const idx=DAYS.findIndex(d=>d.pr===pr);
    openDay(idx);
  },100);
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
renderHome();
</script>
</body>
</html>
