[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8888
  targetPort = 3000

# Redirections SPA
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

# Sécurité : headers sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# JS — no-cache : vérifie si nouveau fichier à chaque visite, re-télécharge seulement si modifié
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

# CSS — no-cache
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

# HTML — no-cache (app.html et index.html mis à jour fréquemment)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
