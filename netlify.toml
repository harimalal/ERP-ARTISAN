[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8888
  targetPort = 3000

# Routes principales
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/questionnaire"
  to = "/questionnaire.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/import-donnees"
  to = "/import-donnees.html"
  status = 200

[[redirects]]
  from = "/merci"
  to = "/merci.html"
  status = 200

# Notes internes du projet — jamais servies publiquement, même si le fichier
# existe dans le repo (publish = "." sert tout par défaut). force = true
# court-circuite le fichier statique ; les vraies pages de l'app (js/, css/,
# *.html à la racine) ne sont pas concernées.
[[redirects]]
  from = "/.claude/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/SESSIONS/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/MISSIONS/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/PLAYBOOK/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.hermes/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml.backup_pre_v19"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/index.html.backup_pre_v19"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/gitignore"
  to = "/index.html"
  status = 404
  force = true

# Sécurité : headers sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# JS — chargement immédiat depuis cache + vérification en arrière-plan
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# CSS — même stratégie
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# HTML — vérifie toujours (app.html change souvent)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Slideshow — autorisé en iframe same-origin pour intégration landing
[[headers]]
  for = "/arteasy-slideshow.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
